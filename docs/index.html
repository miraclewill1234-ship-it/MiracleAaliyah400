   <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 id="title">Miracle's Website</h1>
        <p> SVG </p>
    </header>

    <main>

        <!-- SVG -->
        <svg class="my-svg" width="400" height="400" viewBox="0 0 400 400">

            <!-- Main circle -->
            <circle 
                id="mainCircle"
                cx="200"
                cy="200"
                r="100"
            >

                <!-- SVG animation -->
                <animate
                    attributeName="r"
                    from="100"
                    to="130"
                    dur="2s"
                    repeatCount="indefinite"
                    direction="alternate"
                />

            </circle>

            <!-- Text inside SVG -->
            <text
                x="200"
                y="205"
                text-anchor="middle"
                class="svg-text">
                MIRACLE
            </text>

        </svg>

        <br>

        <!-- JavaScript button -->
        <button id="changeButton">
            Change My Website
        </button>

        <p id="message">
            Click the button!
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html> 
</body>
